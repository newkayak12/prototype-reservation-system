reservation:
  queue:
    # 동시 입장 허용치. 코드 기본값에 맡기지 않고 여기서 명시한다 - 이 값이 곧 처리량
    # 상한이라, 근거 없이 정해지면 아키텍처가 아니라 이 숫자를 측정하게 된다.
    #
    #   capacity = 목표처리량 x (폴링간격/2 + 예약지연)
    #            = 500 req/s x (0.5s / 2 + 0.04s)
    #            = 145
    #
    # 대기열이 폴링 기반이라 permit 한 장의 회전 주기는 "승격 -> 사용자가 다음 폴링에서
    # 알아챔 -> 예약 호출 -> 반납"이다. 폴링 간격(=CDN TTL)을 늘리면 회전이 그만큼 느려지므로
    # capacity를 비례해서 올려 갚아야 처리량이 유지된다. 둘은 따로 만지는 손잡이가 아니다.
    #
    # 위 산식과 별개로 천장이 하나 더 있다: capacity는 곧 "예약 API에 동시에 들어와 있는
    # 요청 수"이므로 서블릿 스레드 풀(기본 200)을 넘기면 배압이 앱 바깥이 아니라 Tomcat
    # 큐에 쌓인다. 대기열을 둔 이유가 사라진다.
    admission-capacity: 150

    # 입장 허용의 수명. permit lease와 ADMITTED 엔트리에 같이 걸린다.
    # 입장하고 예약하지 않은 사용자의 자리를 언제 회수할 것인가의 문제다.
    admission-time-to-live-seconds: 300

    # 리컨실 워커 주기. 승격의 주된 경로는 사용자 요청(진입/폴링)이고 이 워커는 요청이
    # 닿지 않는 자리 - lease 만료, 홀드 만료로 돌아온 좌석, 유실된 승격 - 만 치운다.
    # 응답성이 아니라 "유실을 얼마나 늦게 알아채도 되는가"로 정한다.
    reconcile-interval-millis: 5000

    # 대기 티켓 자체의 수명. 줄을 서다 이탈한 사용자가 언제 대기열에서 사라지는가.
    ticket-time-to-live-seconds: 1800
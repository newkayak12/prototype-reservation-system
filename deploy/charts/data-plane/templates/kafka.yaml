{{- /*
  Strimzi Kafka — 단일 브로커 KRaft(ZooKeeper 없음, DESIGN-010 §4.5).
  Strimzi operator(및 CRD)가 먼저 설치돼 있어야 한다(bootstrap.sh 가 보장).
  운영 대비 "용량만" 축소: 브로커 1 · 복제 팩터 1. 토폴로지는 유지.
*/ -}}
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: combined
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-plane.labels" . | nindent 4 }}
    strimzi.io/cluster: {{ .Values.kafka.clusterName }}
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.kafka.storage }}
        deleteClaim: true
        kraftMetadata: shared
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: {{ .Values.kafka.clusterName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-plane.labels" . | nindent 4 }}
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: {{ .Values.kafka.version | quote }}
    metadataVersion: {{ .Values.kafka.metadataVersion | quote }}
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # 단일 브로커라 모든 복제/ISR = 1 (용량 축소, 토폴로지 아님)
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      # 파티션 키=aggregate_id 순서 보장 전제(ADR-009) — 파티션 수는 토픽 생성 시 지정
      auto.create.topics.enable: "true"
  entityOperator:
    topicOperator: {}
    userOperator: {}

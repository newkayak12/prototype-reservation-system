name: Code Review

on:
    pull_request:
        types: [ opened, reopened, synchronize ]
        paths:
            - "**/*.kt"
            - "**/*.java"

permissions:
    pull-requests: write
    contents: read

jobs:
    review:
        if: "!contains(github.event.pull_request.title, '[NO_REVIEW]')"
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5.0.0
                with:
                    fetch-depth: 1

            -   name: Claude Code Review
                uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
                with:
                    anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                    github_token: ${{ secrets.GITHUB_TOKEN }}
                    prompt: |
                        REPO: ${{ github.repository }}
                        PR NUMBER: ${{ github.event.pull_request.number }}
                        LANGUAGE: Korean

                        ${{ vars.CODE_REVIEW_PROMPT }}

                        구체적인 문제는 해당 라인에 인라인 코멘트로, 전체 요약은 PR 코멘트 하나로 남겨라.
                    claude_args: |
                        --model sonnet
                        --max-turns 30
                        --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
